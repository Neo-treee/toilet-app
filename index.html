<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>トイレマップ ー みんなで世界のトイレを見つけて投稿しよう</title>
  <meta name="description" content="世界中の公衆トイレや利用可能なトイレを簡単に検索・投稿できるシェアリングアプリです。近くのトイレを今すぐ見つけよう！">
  <meta name="theme-color" content="#007bff">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%E3%83%88%E3%82%A4%E3%83%AC%E3%83%9E%E3%83%83%E3%83%97%22,%22short_name%22:%22%E3%83%88%E3%82%A4%E3%83%AC%E3%83%9E%E3%83%83%E3%83%97%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23007bff%22}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- 多言語対応 (i18n) 辞書と処理 -->
  <script>
    const i18n = {
      ja: {
        guest: "ゲスト", settings: "設定", searchLocPlaceholder: "駅名・住所で検索 (例: 新宿駅)", searchBtn: "🔍 検索",
        filterAccessible: "♿ 多目的", filterBaby: "👶 オムツ台", filterWashlet: "🚽 温水洗浄便座", filterOpen24h: "⏰ 24時間", filterFacility: "🏪 施設/コンビニ",
        loadingAuth: "認証・接続中...", addRecord: "＋ 記録", searchKwPlaceholder: "キーワード検索...", sortNewest: "新着順", sortHighest: "評価順", sortNearest: "距離が近い順",
        bulkDelete: "選択削除", privacyPolicy: "プライバシーポリシー", support: "運営・お問い合わせ", tabMap: "🗺️ マップ", tabList: "📋 みんなの記録",
        formTitle: "トイレを記録", visibility: "公開範囲", visGroup: "👥 グループのみ共有", visPublic: "🌐 全体公開（みんなで共有）", visPrivate: "🔒 自分のみ（クラウド非公開保存）",
        photoAttach: "写真の添付（自動軽量化されます）", facilities: "設備情報（複数選択可）", ratingTitle: "評価（星1〜5）", commentLabel: "コメント", commentPlaceholder: "例：清潔、トイレットペーパー完備",
        btnSave: "保存する", settingTitle: "ユーザー＆グループ設定", nicknameLabel: "ニックネーム", nicknamePlaceholder: "例：たろう", groupListLabel: "参加中のグループ一覧（招待コードをコピーできます）",
        createGroupLabel: "✨ 新しいグループを作る", createGroupPlaceholder: "グループ名 (例: 家族)", btnCreate: "作成", joinGroupLabel: "🤝 招待コードで参加する", joinGroupPlaceholder: "招待コードを入力",
        btnJoin: "参加", joinGroupDesc: "友達から共有された招待コードを入力してください。", btnSaveSettings: "設定を保存", optAll: "🌐 すべて表示", optPublicOnly: "🌐 全体公開のみ",
        optPrivateOnly: "🔒 自分のみ", loadingSearch: "場所を検索中...", loadingConnect: "接続中...", loadingSave: "保存中...", loadingImage: "画像を圧縮・アップロード中...",
        loadingDelete: "削除中...", loadingBulkDelete: "一括削除中...", loadingGroupCreate: "グループ作成中...", loadingGroupJoin: "グループを探しています...", errAuth: "匿名認証に失敗しました: ",
        errSearch: "該当する場所が見つかりませんでした。", errSearchSys: "検索処理でエラーが発生しました。", alertWait: "認証処理中のため少々お待ちください。", alertNoGroupForPost: "参加中のグループがありません。設定からグループを追加するか、別の公開範囲を選んでください。",
        alertSaveFail: "保存に失敗しました: ", confirmDelete: "この記録を削除しますか？", errNotFound: "データが見つかりません。", errRefFail: "参照の取得に失敗しました。", errNotOwner: "本人の投稿のみ削除できます。",
        errDeleteFail: "削除に失敗しました: ", alertCheckDel: "削除したい項目にチェックを入れてください。", confirmBulkDelete1: "選択した ", confirmBulkDelete2: " 件の記録を削除しますか？",
        errBulkFail: "一括削除処理に一部失敗しました: ", emptyList: "表示できる記録がありません。", adSponsor: "スポンサー広告", adPlaceholder: "[ここにGoogle AdSenseの広告が表示されます]",
        btnNavi: "🧭 ナビ起動", btnMap: "📍 地図", btnDel: "🗑️ 削除", distPrefix: "📍 約 ", noComment: "コメントなし", anonymous: "名無し", badgePublic: "🌐 全体共有",
        badgePrivate: "🔒 自分のみ", badgeGroup: "👥 ", badgePrivateIcon: "[🔒自分のみ]", badgePublicIcon: "[🌐全体]", badgeGroupIcon: "[👥", distCurrent: "現在地から ",
        msgCopyOk: "招待コードをコピーしました！LINE等に貼り付けて共有してください。", msgCopyFail: "コピーに失敗しました。手動で長押ししてコピーしてください。", alertGroupNameReq: "グループ名を入力してください。",
        msgGroupCreated1: "グループ「", msgGroupCreated2: "」を作成しました！設定画面から招待コードをコピーして友達に教えてあげてください。", errGroupCreateFail: "作成に失敗しました: ",
        alertGroupIdReq: "招待コードを入力してください。", alertGroupAlready: "すでに参加しているグループです。", alertGroupNotFound: "指定された招待コードのグループが見つかりません。",
        msgGroupJoined1: "グループ「", msgGroupJoined2: "」に参加しました！", errGroupJoinFail: "参加エラー: ", confirmLeaveGroup: "このグループから抜けますか？ (投稿したデータは残り続けます)",
        msgSettingsSaved: "設定を保存しました。", msgLocNotSupported: "お使いのブラウザは位置情報をサポートしていません。", msgLocFail: "現在地の取得に失敗しました。端末の位置情報設定を確認してください。",
        noJoinedGroups: "参加中のグループはありません", btnCopy: "📋 複製", btnLeave: "抜ける", currentLocationPopup: "現在地", btnNaviMap: "🧭 ナビ", sponsorPRTitle: "【PR】おすすめの外出用衛生グッズ",
        sponsorPRDesc: "外出先のトイレでも安心！携帯用除菌ミスト＆流せるティッシュ", sponsorPRLink: "Amazonで詳細を見る ↗", lblPrivacyPolicy1: "<b>1. 情報の取得と利用</b><br>当アプリでは、ユーザーの位置情報および投稿されたコメント・写真をサービス提供の目的でのみ使用します。",
        lblPrivacyPolicy2: "<b>2. 広告の配信について</b><br>当アプリでは第三者配信事業者（Google AdSense等）による広告を掲載する場合があります。", lblPrivacyPolicy3: "<b>3. お問い合わせ</b><br>投稿の削除依頼につきましては投稿一覧画面より削除を行っていただくか、管理者へご連絡ください。",
        groupNotSet: "グループ未設定", postedBy: "投稿者: ",
        commentModalTitle: "コメント・レビュー一覧",
        btnOpenComments: "💬 コメントを見る",
        postCommentBtn: "送信する",
        commentInputPlaceholder: "状況や感想を入力...",
        noCommentsYet: "まだコメントがありません。"
       },
      en: { /* 英語 (省略) */ }
      // 他の言語もそのまま維持
    };

    const userLangStr = (navigator.language || navigator.userLanguage).substring(0, 2);
    const lang = i18n[userLangStr] ? userLangStr : 'en'; 

    function t(key) {
      if (i18n[lang] && i18n[lang][key]) return i18n[lang][key];
      return i18n['en'] && i18n['en'][key] ? i18n['en'][key] : key;
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerHTML = t(key);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t(key);
      });
      document.documentElement.lang = lang; 
    }
    
    window.addEventListener('DOMContentLoaded', applyTranslations);
  </script>
</head>
<body>

  <!-- ヘッダー設定バー -->
  <div id="header-settings">
    <div style="display:flex; align-items:center; gap:8px;">
      <span>👤 <span id="disp-nickname"></span></span>
      <select id="disp-group-select" onchange="changeDisplayGroup()" style="padding: 4px; font-size: 12px; border-radius: 4px; border: none; outline: none; background: #fff; color: #333; max-width: 150px;">
      </select>
    </div>
    <button class="settings-btn" onclick="openSettings()" data-i18n="settings"></button>
  </div>

  <!-- 駅名・住所検索バー -->
  <div id="search-location-bar">
    <input type="text" id="input-search-location" class="loc-input" data-i18n-placeholder="searchLocPlaceholder">
    <button class="loc-btn" onclick="searchLocation()" data-i18n="searchBtn"></button>
  </div>

  <!-- 絞り込みフィルターバー -->
  <div id="filter-bar">
    <div class="filter-chip" data-feature="accessible" onclick="toggleFilter(this)" data-i18n="filterAccessible"></div>
    <div class="filter-chip" data-feature="baby" onclick="toggleFilter(this)" data-i18n="filterBaby"></div>
    <div class="filter-chip" data-feature="washlet" onclick="toggleFilter(this)" data-i18n="filterWashlet"></div>
    <div class="filter-chip" data-feature="open24h" onclick="toggleFilter(this)" data-i18n="filterOpen24h"></div>
    <div class="filter-chip" data-feature="facility" onclick="toggleFilter(this)" data-i18n="filterFacility"></div>
  </div>
  
  <div id="loading">
    <div id="loading-text" data-i18n="loadingAuth"></div>
  </div>

  <div id="content-area">
    <div id="map"></div>
    <button id="fab-add-spot" onclick="addPinAtCenter()" data-i18n="addRecord"></button>
    
    <div id="list-view">
      <div class="controls-area">
        <input type="text" id="search-box" class="search-input" data-i18n-placeholder="searchKwPlaceholder" onkeyup="renderList()">
        <select id="sort-box" class="sort-select" onchange="renderList()">
          <option value="newest" data-i18n="sortNewest"></option>
          <option value="highest" data-i18n="sortHighest"></option>
          <option value="nearest" data-i18n="sortNearest"></option>
        </select>
        <button class="btn-bulk-delete" onclick="deleteSelectedSpots()" data-i18n="bulkDelete"></button>
      </div>
      <div id="list-container"></div>
      
      <div class="footer-links">
        <a href="#" onclick="openPrivacyModal()" data-i18n="privacyPolicy"></a> | 
        <a href="#" onclick="openPrivacyModal()" data-i18n="support"></a>
      </div>
    </div>
  </div>

  <!-- 固定バナー広告枠 -->
  <div class="ad-container-banner">
    <div data-i18n="adSponsor"></div>
    <div style="font-size: 11px; color: #999;" data-i18n="adPlaceholder"></div>
  </div>

  <div id="bottom-nav">
    <div class="nav-btn active" id="nav-map" onclick="switchTab('map')" data-i18n="tabMap"></div>
    <div class="nav-btn" id="nav-list" onclick="switchTab('list')" data-i18n="tabList"></div>
  </div>

  <!-- 投稿フォーム -->
  <div id="input-form">
    <div class="form-header">
      <span class="form-title" data-i18n="formTitle"></span>
      <button class="close-btn" onclick="closeForm()">×</button>
    </div>
    <div class="form-group">
      <label data-i18n="visibility"></label>
      <div class="privacy-group">
        <label><input type="radio" name="privacy" value="group" checked onchange="toggleGroupSelect()"> <span data-i18n="visGroup"></span></label>
        <select id="select-post-group" style="margin-left: 25px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; width: calc(100% - 25px); box-sizing: border-box;"></select>
        <label><input type="radio" name="privacy" value="public" onchange="toggleGroupSelect()"> <span data-i18n="visPublic"></span></label>
        <label><input type="radio" name="privacy" value="private" onchange="toggleGroupSelect()"> <span data-i18n="visPrivate"></span></label>
      </div>
    </div>
    <div class="form-group">
      <label data-i18n="photoAttach"></label>
      <input type="file" id="file-photo" accept="image/*" style="font-size:12px;">
    </div>
    <div class="form-group">
      <label data-i18n="facilities"></label>
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" id="chk-accessible"> <span data-i18n="filterAccessible"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="chk-baby"> <span data-i18n="filterBaby"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="chk-washlet"> <span data-i18n="filterWashlet"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="chk-open24h"> <span data-i18n="filterOpen24h"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="chk-facility"> <span data-i18n="filterFacility"></span></label>
      </div>
    </div>
    <div class="form-group">
      <label data-i18n="ratingTitle"></label>
      <div class="star-rating">
        <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
      </div>
    </div>
    <div class="form-group">
      <label data-i18n="commentLabel"></label>
      <textarea id="toilet-comment" data-i18n-placeholder="commentPlaceholder"></textarea>
    </div>
    <button class="save-btn" onclick="saveData()" data-i18n="btnSave"></button>
  </div>

  <!-- ユーザー設定モーダル -->
  <div id="settings-modal">
    <!-- 省略せずにそのまま維持 -->
    <div class="form-header">
      <span class="form-title" data-i18n="settingTitle"></span>
      <button class="close-btn" onclick="closeSettings()">×</button>
    </div>
    <div class="form-group">
      <label data-i18n="nicknameLabel"></label>
      <input type="text" id="input-nickname" data-i18n-placeholder="nicknamePlaceholder">
    </div>
    
    <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

    <div class="form-group">
      <label data-i18n="groupListLabel"></label>
      <div id="group-list-container" style="margin-bottom:15px; font-size:13px; color:#555;">
      </div>
      
      <label style="font-size: 13px; color:#007bff;" data-i18n="createGroupLabel"></label>
      <div style="display:flex; gap:8px; margin-bottom: 15px;">
        <input type="text" id="input-create-group-name" data-i18n-placeholder="createGroupPlaceholder" style="flex:1;">
        <button class="action-btn" onclick="createNewGroup()" data-i18n="btnCreate"></button>
      </div>
      
      <label style="font-size: 13px; color:#007bff;" data-i18n="joinGroupLabel"></label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="input-join-group-id" data-i18n-placeholder="joinGroupPlaceholder" style="flex:1;">
        <button class="join-btn" onclick="joinGroupById()" data-i18n="btnJoin"></button>
      </div>
      <small style="color:#666; display:block; margin-top:5px;" data-i18n="joinGroupDesc"></small>
    </div>
    <button class="save-btn" onclick="saveSettings()" data-i18n="btnSaveSettings"></button>
  </div>

  <!-- プライバシーポリシーモーダル -->
  <div id="privacy-modal">
    <div class="form-header">
      <span class="form-title" data-i18n="privacyPolicy"></span>
      <button class="close-btn" onclick="closePrivacyModal()">×</button>
    </div>
    <div style="font-size: 12px; color: #444; line-height: 1.6;">
      <p data-i18n="lblPrivacyPolicy1"></p>
      <p data-i18n="lblPrivacyPolicy2"></p>
      <p data-i18n="lblPrivacyPolicy3"></p>
    </div>
  </div>

  <!-- コメント表示・投稿用モーダル -->
  <div id="comment-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:#fff; width:90%; max-width:500px; max-height:80vh; border-radius:12px; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; gap:12px; overflow:hidden;">
      <div class="form-header" style="margin:0;">
        <span class="form-title" data-i18n="commentModalTitle">コメント・レビュー一覧</span>
        <button class="close-btn" onclick="closeCommentModal()">×</button>
      </div>
      
      <!-- コメント一覧表示エリア -->
      <div id="comment-list-container" style="flex:1; overflow-y:auto; border:1px solid #eee; padding:10px; border-radius:8px; display:flex; flex-direction:column; gap:10px;">
        <!-- JSで動的に追加されます -->
      </div>

      <!-- コメント投稿フォーム -->
      <div style="display:flex; gap:8px;">
        <input type="text" id="input-new-comment" data-i18n-placeholder="commentInputPlaceholder" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
        <button class="action-btn" onclick="submitComment()" data-i18n="postCommentBtn">送信</button>
      </div>
    </div>
  </div>

  <!-- ▼ スクリプトは必ずすべてのHTML要素の下（</body>の直前）に配置します ▼ -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
