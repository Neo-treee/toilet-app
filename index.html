    // 言語判定の最適化（10言語対応）
    const userLangFull = (navigator.language || navigator.userLanguage).toLowerCase();
    let lang = 'en'; // デフォルト

    if (userLangFull.startsWith('ja')) lang = 'ja';
    else if (userLangFull.startsWith('zh-tw') || userLangFull.startsWith('zh-hk') || userLangFull.startsWith('zh-mo')) lang = 'zh-TW';
    else if (userLangFull.startsWith('zh')) lang = 'zh-CN';
    else if (userLangFull.startsWith('ko')) lang = 'ko';
    else if (userLangFull.startsWith('es')) lang = 'es';
    else if (userLangFull.startsWith('fr')) lang = 'fr';
    else if (userLangFull.startsWith('de')) lang = 'de';
    else if (userLangFull.startsWith('pt')) lang = 'pt';
    else if (userLangFull.startsWith('ru')) lang = 'ru';

    function t(key) {
      if (i18n[lang] && i18n[lang][key]) return i18n[lang][key];
      return i18n['en'] && i18n['en'][key] ? i18n['en'][key] : key;
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerHTML = t(key);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t(key);
      });
      document.documentElement.lang = lang; 
    }
    
    window.addEventListener('DOMContentLoaded', applyTranslations);

  <!-- 固定バナー広告枠 -->
  <div class="ad-container-banner">
    <div data-i18n="adSponsor"></div>
    <div style="font-size: 11px; color: #999;" data-i18n="adPlaceholder"></div>
  </div>

  <div id="bottom-nav">
    <div class="nav-btn active" id="nav-map" onclick="switchTab('map')" data-i18n="tabMap"></div>
    <div class="nav-btn" id="nav-list" onclick="switchTab('list')" data-i18n="tabList"></div>
  </div>

  <!-- マップ右下のフローティングボタン -->
  <div id="fab-container">
    <button class="fab-btn" onclick="openRegisterForm()" data-i18n="fabRegisterToilet"></button>
    <button class="fab-btn" id="fab-add-record" onclick="openRecordForm()" data-i18n="fabAddRecord"></button>
  </div>

  <!-- 【1】トイレ登録フォーム（みんなの共有財産） -->
  <div id="input-form-register" class="input-form-modal" style="display:none; position:fixed; bottom:0; width:100%; max-height:45vh; overflow-y:auto; background:#fff; z-index:2000; padding:20px; box-sizing:border-box; border-radius:16px 16px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);">
    <div class="form-header">
      <span class="form-title" data-i18n="regFormTitle"></span>
      <button class="close-btn" onclick="closeForms()">×</button>
    </div>
    
    <div class="form-group">
      <label data-i18n="regFacilitiesLabel"></label>
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" id="reg-accessible"> <span data-i18n="filterAccessible"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-baby"> <span data-i18n="filterBaby"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-washlet"> <span data-i18n="filterWashlet"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-western"> <span data-i18n="filterWestern"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-open24h"> <span data-i18n="filterOpen24h"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-facility"> <span data-i18n="filterFacility"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-station"> <span data-i18n="filterStation"></span></label>
        <label class="checkbox-item"><input type="checkbox" id="reg-parking"> <span data-i18n="filterParking"></span></label>
      </div>
    </div>
    <div class="form-group">
      <label data-i18n="regHoursLabel"></label>
      <input type="text" id="reg-hours" data-i18n-placeholder="regHoursPlaceholder" style="width:100%; padding:8px;">
    </div>
    <div class="form-group">
      <label data-i18n="regCleanCrowdLabel"></label>
      <select id="reg-cleanliness" style="width:100%; padding:8px; margin-bottom:8px;">
        <option value="" data-i18n="regCleanPlaceholder"></option>
        <option value="5" data-i18n="regClean5"></option>
        <option value="3" data-i18n="regClean3"></option>
        <option value="1" data-i18n="regClean1"></option>
      </select>
      <select id="reg-congestion" style="width:100%; padding:8px;">
        <option value="" data-i18n="regCrowdPlaceholder"></option>
        <option value="empty" data-i18n="regCrowdEmpty"></option>
        <option value="normal" data-i18n="regCrowdNormal"></option>
        <option value="crowded" data-i18n="regCrowdCrowded"></option>
      </select>
    </div>
    <div class="form-group">
      <label data-i18n="regRatingLabel"></label>
      <div class="star-rating">
        <input type="radio" id="reg-star5" name="reg-rating" value="5"><label for="reg-star5">★</label>
        <input type="radio" id="reg-star4" name="reg-rating" value="4"><label for="reg-star4">★</label>
        <input type="radio" id="reg-star3" name="reg-rating" value="3"><label for="reg-star3">★</label>
        <input type="radio" id="reg-star2" name="reg-rating" value="2"><label for="reg-star2">★</label>
        <input type="radio" id="reg-star1" name="reg-rating" value="1"><label for="reg-star1">★</label>
      </div>
    </div>
    <div class="form-group">
      <label data-i18n="regPhotoLabel"></label>
      <input type="file" id="reg-photo" accept="image/*">
    </div>
    <button class="save-btn" onclick="saveRegisterData()" style="width:100%; padding:12px; background:#28a745; color:#fff; border:none; border-radius:8px;" data-i18n="regSubmitBtn"></button>
  </div>


  <!-- 【2】トイレ記録フォーム（自分の思い出） -->
  <div id="input-form-record" class="input-form-modal" style="display:none; position:fixed; bottom:0; width:100%; max-height:45vh; overflow-y:auto; background:#fff; z-index:2000; padding:20px; box-sizing:border-box; border-radius:16px 16px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);">
    <div class="form-header">
      <span class="form-title" data-i18n="recFormTitle"></span>
      <button class="close-btn" onclick="closeForms()">×</button>
    </div>
    
    <div class="form-group">
      <label data-i18n="recPrivacyLabel"></label>
      <div class="privacy-group">
        <label><input type="radio" name="rec-privacy" value="private" checked> <span data-i18n="recPrivacyPrivate"></span></label>
        <label><input type="radio" name="rec-privacy" value="group"> <span data-i18n="recPrivacyGroup"></span></label>
        <label><input type="radio" name="rec-privacy" value="public"> <span data-i18n="recPrivacyPublic"></span></label>
      </div>
    </div>

    <div class="form-group" id="rec-group-section" style="display: none;">
      <label data-i18n="recGroupSelectLabel"></label>
      <select id="rec-group-select" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <option value="" data-i18n="recGroupPlaceholder"></option>
      </select>
    </div>

    <div class="form-group">
      <label data-i18n="recRatingLabel"></label>
      <div class="star-rating">
        <input type="radio" id="rec-star5" name="rec-rating" value="5"><label for="rec-star5">★</label>
        <input type="radio" id="rec-star4" name="rec-rating" value="4"><label for="rec-star4">★</label>
        <input type="radio" id="rec-star3" name="rec-rating" value="3"><label for="rec-star3">★</label>
        <input type="radio" id="rec-star2" name="rec-rating" value="2"><label for="rec-star2">★</label>
        <input type="radio" id="rec-star1" name="rec-rating" value="1"><label for="rec-star1">★</label>
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="recDateLabel"></label>
      <input type="date" id="rec-date" style="width:100%; padding:8px;">
    </div>
    <div class="form-group">
      <label data-i18n="recCompanionLabel"></label>
      <input type="text" id="rec-companion" data-i18n-placeholder="recCompanionPlaceholder" style="width:100%; padding:8px;">
    </div>
    <div class="form-group">
      <label data-i18n="recMemoLabel"></label>
      <textarea id="rec-memo" data-i18n-placeholder="recMemoPlaceholder" style="width:100%; height:80px; padding:8px;"></textarea>
    </div>
    <div class="form-group">
      <label data-i18n="recPhotoLabel"></label>
      <input type="file" id="rec-photo" accept="image/*">
    </div>
    <!-- 紐付け用の隠しフィールド -->
    <input type="hidden" id="rec-target-toilet-id" value="">
    
    <button class="save-btn" onclick="saveRecordData()" style="width:100%; padding:12px; background:#007bff; color:#fff; border:none; border-radius:8px;" data-i18n="recSubmitBtn"></button>
  </div>

  <!-- ユーザー設定モーダル -->
  <div id="settings-modal">
    <div class="form-header">
      <span class="form-title" data-i18n="settingTitle"></span>
      <button class="close-btn" onclick="closeSettings()">×</button>
    </div>
    <div class="form-group">
      <label data-i18n="nicknameLabel"></label>
      <input type="text" id="input-nickname" data-i18n-placeholder="nicknamePlaceholder">
    </div>
    
    <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

    <div class="form-group">
      <label data-i18n="groupListLabel"></label>
      <div id="group-list-container" style="margin-bottom:15px; font-size:13px; color:#555;">
        <!-- グループリストが表示されます -->
      </div>
      
      <label style="font-size: 13px; color:#007bff;" data-i18n="createGroupLabel"></label>
      <div style="display:flex; gap:8px; margin-bottom: 15px;">
        <input type="text" id="input-create-group-name" data-i18n-placeholder="createGroupPlaceholder" style="flex:1;">
        <button class="action-btn" onclick="createNewGroup()" data-i18n="btnCreate"></button>
      </div>
      
      <label style="font-size: 13px; color:#007bff;" data-i18n="joinGroupLabel"></label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="input-join-group-id" data-i18n-placeholder="joinGroupPlaceholder" style="flex:1;">
        <button class="join-btn" onclick="joinGroupById()" data-i18n="btnJoin"></button>
      </div>
      <small style="color:#666; display:block; margin-top:5px;" data-i18n="joinGroupDesc"></small>
    </div>
    
    <button class="save-btn" onclick="saveSettings()" data-i18n="btnSaveSettings"></button>
  </div>

  <!-- プライバシーポリシーモーダル -->
  <div id="privacy-modal">
    <div class="form-header">
      <span class="form-title" data-i18n="privacyPolicy"></span>
      <button class="close-btn" onclick="closePrivacyModal()">×</button>
    </div>
    <div style="font-size: 12px; color: #444; line-height: 1.6;">
      <p data-i18n="lblPrivacyPolicy1"></p>
      <p data-i18n="lblPrivacyPolicy2"></p>
      <p data-i18n="lblPrivacyPolicy3"></p>
    </div>
  </div>

  <!-- コメント表示・投稿用モーダル -->
  <div id="comment-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:#fff; width:90%; max-width:500px; max-height:80vh; border-radius:12px; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; gap:12px; overflow:hidden;">
      <div class="form-header" style="margin:0;">
        <span class="form-title" data-i18n="commentModalTitle"></span>
        <button class="close-btn" onclick="closeCommentModal()">×</button>
      </div>
      
      <!-- コメント一覧表示エリア -->
      <div id="comment-list-container" style="flex:1; overflow-y:auto; border:1px solid #eee; padding:10px; border-radius:8px; display:flex; flex-direction:column; gap:10px;">
        <!-- JSで動的に追加されます -->
      </div>

      <!-- コメント投稿フォーム -->
      <div style="display:flex; gap:8px;">
        <input type="text" id="input-new-comment" data-i18n-placeholder="commentInputPlaceholder" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
        <button class="action-btn" onclick="submitComment()" data-i18n="postCommentBtn"></button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
